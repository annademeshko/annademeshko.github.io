<style>
/* Layout: a side-view pixel museum. The building, guard and visitors are pixel art on a low-res canvas; the memes hang in it at full resolution. */
:root{
  --night:#0e0f16; --ink:#f3efe6; --dim:#a7a3b5; --gold:#e2bd5c; --gold-d:#8a6a22; --red:#d9353f; --panel:#1b1c27; --panel-2:#262838;

  --sans:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--sans)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--pix);font-weight:700;font-size:clamp(22px,3.2vw,34px);letter-spacing:.02em}
.head h1 span{color:var(--gold)}
.head p a.home{color:var(--gold);text-decoration:none}.head p a.home:hover{text-decoration:underline}
.head p{margin:0;font-family:var(--pix);color:var(--dim);font-size:14px}

/* stage */
.stage{position:relative;overflow:hidden;border-radius:6px;background:#141626;box-shadow:0 0 0 2px #2a2c3d,0 20px 50px rgba(0,0,0,.5);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{pointer-events:none}
.art{position:absolute;display:block;cursor:not-allowed;-webkit-user-drag:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.plq{position:absolute;padding:0;border:0;background:none;cursor:pointer}
.plq:hover,.plq:focus-visible{outline:2px solid var(--gold);outline-offset:1px;background:rgba(255,230,160,.12)}
.sheen{position:absolute;pointer-events:none;background:linear-gradient(180deg,rgba(255,240,200,.16),rgba(255,240,200,0) 45%)}
.sign{position:absolute;font-family:var(--pix);font-weight:600;color:#2a1f08;background:linear-gradient(#f0d27a,#c9a24a);border:2px solid #6b4f1d;text-align:center;line-height:1.1;padding:.25em .5em;white-space:nowrap}
.alarm{position:absolute;inset:0;pointer-events:none;background:rgba(217,53,63,.0);display:grid;place-items:center;font-family:var(--pix);font-weight:700;color:#fff;text-shadow:0 2px 0 #000;font-size:clamp(18px,3vw,30px);opacity:0;transition:opacity .15s}
.alarm.on{opacity:1;animation:siren .4s steps(2) infinite}
@keyframes siren{0%{background:rgba(217,53,63,.35)}100%{background:rgba(40,70,220,.25)}}

/* plaque dialog, like a game text box */
.box{position:relative;margin-top:12px;min-height:74px;background:rgba(14,15,22,.92);border:3px solid var(--gold);box-shadow:0 0 0 3px #000;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--pix)}
.box .txt{flex:1 1 260px;min-width:0}
.box b{display:block;font-size:17px;color:var(--gold);font-weight:600}
.box span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.box .btns{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{border:2px solid var(--ink);background:transparent;padding:7px 12px;font-family:var(--pix);font-size:14px;box-shadow:3px 3px 0 #000}
.pbtn:hover{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.pbtn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold)}

/* controls */
.ctrl{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:14px;flex-wrap:wrap;font-family:var(--pix)}
.pad{display:none}
.pad button{width:58px;height:52px;border:2px solid var(--ink);background:var(--panel);font-size:22px;box-shadow:3px 3px 0 #000;touch-action:none}

.look-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;max-width:980px;width:100%}
@media (max-width:760px){.look-in{grid-template-columns:1fr;gap:18px}}
.frame{padding:14px;background:linear-gradient(135deg,#f0d27a,#b98d2c 40%,#f0d27a 60%,#8a6a22);box-shadow:0 0 0 3px #4a360f,0 20px 50px rgba(0,0,0,.6)}
.frame img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#000;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.label{background:#efe9da;color:#1d1b16;padding:18px 20px;font-family:var(--sans);box-shadow:4px 4px 0 #000}
.label h2{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.label .meta{margin:6px 0 12px;color:#55524a;font-size:14px;line-height:1.45}
.label p{margin:0 0 14px;font-size:15px;line-height:1.55;max-width:60ch}
.label .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label .lbtn{border:2px solid #1d1b16;background:#1d1b16;color:#efe9da;padding:8px 13px;font-family:var(--pix);font-size:14px}
.label .lbtn.ghost{background:transparent;color:#1d1b16}
.label .inv{font-family:var(--pix);font-size:12px;color:#8a8577;margin-top:12px}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;font-family:var(--pix);border:2px solid #111;padding:.25em .55em;white-space:nowrap;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;border:5px solid transparent;border-top-color:#111;transform:translateX(-50%)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:#000;border:2px solid var(--gold);font-family:var(--pix);padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.guide[hidden]{display:none}
</style>
</head>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- the collection ---------- */
  const HALL = { from: 0, to: 1060 }, SECRET = { from: 1090, to: 1320 }, DL = { from: 1350, to: 2460 }, WORLD_W = 2460;
  const ART = [
    { id: 'cillian', sp: '70LcF31zb1H0PyJoS1Sx1r', x: 150, img: '/ru/memzey/img/m19.jpg', r: 672 / 700, title: 'Взгляд человека, которому сказали „там небольшие правки“', author: '', meta: '2023 · масло, тревога, 0 часов сна', text: 'Одни искусствоведы считают, что он смотрит в бездну, а другие уверены, что в 47 комментариев в Figma.', track: 'Radiohead — Creep' },
    { id: 'corner', sp: '53rVYwGiKUC3gYX8SQQYYU', x: 300, img: '/ru/memzey/img/m05.jpg', r: 682 / 700, title: 'Интроверт на тимбилдинге', author: 'Аноним, сохранивший душевное равновесие', meta: '2000-е · ковролин, соцбатарейка 2%', text: 'Единственная работа коллекции, которую можно повесить в угол, и она будет на своём месте. Герой провёл здесь весь корпоратив и называет его лучшим в карьере.', track: 'Nirvana — Something in the Way' },
    { id: 'vibe', sp: '5m1dft4KRRawaB9q3p8OKC', x: 460, img: '/ru/memzey/img/m66.jpg', r: 700 / 682, title: '', author: 'Собака', meta: '2020-е · цифровая печать, понедельник', text: 'Галерея объявляет вознаграждение тому, кто найдёт вайб. Последний раз его видели в пятницу в 18:01. Приметы: лёгкий, беззаботный, откликается на «го в бар».', track: 'The Smiths — How Soon Is Now?' },
    { id: 'bday', sp: '1Ist6PR2BZR3n2z2Y5R6S1', x: 640, img: '/ru/memzey/img/m40.jpg', r: 700 / 577, title: '', author: 'Шеф-повар', meta: '2022 · кухня, торт, внезапное осознание', text: 'Реставраторы трижды убирали слёзы с полотна, но они возвращаются каждый год в один и тот же день.', track: 'Lana Del Rey — Summertime Sadness' },
    { id: 'pause', sp: '2ylCrFiBu98SC0vFfaCent', x: 800, img: '/ru/memzey/img/m36.jpg', r: 323 / 700, title: 'Пауза', author: 'Мастер горизонтального жанра', meta: 'век не установлен · ковёр, халат, статус «в сети»', text: 'Перформанс «Я только на минутку прилягу». Идёт без перерыва с 2019 года. Смотрители ходят на цыпочках: если художник проснётся, ему придётся ответить на 312 сообщений.', track: 'The Beatles — I’m Only Sleeping' },
    { id: 'palp', sp: '03oLnmuFIM4ABv68TAcizp', x: 1450, img: '/ru/memzey/img/m07.jpg', r: 700 / 688, title: '', author: 'Head of Galaxy', meta: 'давным-давно · айс-латте на овсяном, абсолютная власть', text: 'Искусствоведы долго спорили, что даёт Палпатину силу: тёмная сторона или айс-латте на овсяном. Спор закрыли, когда сломалась кофемашина и Империя пала за один день.', track: 'Apashe — Duel of the Fates' },
    { id: 'horse', sp: '5T8EDUDqKcs6OSOwEsfqG7', x: 1650, img: '/ru/memzey/img/m39.jpg', r: 700 / 669, title: '', author: 'Мидл с амбициями сеньора', meta: 'предгорья · 3 кофе, 0 обедов, 1 нервный тик', text: 'Если остановится, придётся подумать о жизни. Поэтому не останавливается.', track: 'Queen — Don’t Stop Me Now' },
    { id: 'plea', sp: '2fuCquhmrzHpu5xcA1ci9x', x: 1795, img: '/ru/memzey/img/m56.jpg', r: 1, big: 1, title: 'Мольба', author: 'Кабан, уставший от ТЗ в голосовых', meta: 'галечный пляж · отчаяние, солёный ветер', text: 'Центральная работа зала. Кабан просил нормальное ТЗ у моря, у неба и у продакта. Море ответило шумом. Продакт ответил голосовым на 7 минут: «ну ты понял, что я имел в виду».', track: 'Queen — Under Pressure' },
    { id: 'mcc', sp: '5I9zIwGB6f0edpjO5oX2b9', x: 1990, img: '/ru/memzey/img/m04.jpg', r: 571 / 700, title: '', author: 'Бывший сотрудник', meta: 'кабриолет · солнце, свобода, удалённый LinkedIn', text: 'Портрет человека через пять минут после фразы «я, пожалуй, всё». Единственная работа в зале, у которой нет дедлайна.', track: 'Rupert Holmes — Escape (The Piña Colada Song)' },
    { id: 'dream', sp: '10nyNJ6zNy2YVYLrcwLccB', x: 2180, img: '/ru/memzey/img/m37.jpg', r: 1, title: '', author: 'Мечты сбываются', meta: 'офис мечты · плед, кондиционер на +16', text: 'Онбординг прошёл успешно.', track: 'Radiohead — No Surprises' },
    { id: 'dog', sp: '5W3cjX2J3tjhG8zb6u0qHn', x: 2335, img: '/ru/memzey/img/m34.jpg', r: 700 / 663, title: '', author: 'Team Lead', meta: '2020-е · очки, иммунитет к созвонам', text: 'Честная версия мотивационного плаката. Если не смотреть на проблемы, они перестают смотреть на тебя.', track: 'Daft Punk — Harder, Better, Faster, Stronger' },
    { id: 'witcher', sp: '0C4qTRblY16wi3HVy3vlGX', x: 1240, img: '/ru/memzey/img/m59.jpg', r: 394 / 493, title: 'Хмм', author: 'Геральт из Ривии', meta: 'Туссент · подсолнухи, сталь, серебро, ещё раз хмм', text: 'Хмм.', track: 'Priscilla — The Wolven Storm', secret: true }
  ];
  const WALL_Y = 120, FEET = 172, ART_CY = 62, ART_H = 54;
  ART.forEach(a => { a.h = a.big ? 66 : a.r < .6 ? 62 : ART_H; a.w = Math.round(Math.min(78, a.h * a.r)); a.h = Math.round(a.w / a.r); a.top = Math.round(ART_CY - a.h / 2); a.left = Math.round(a.x - a.w / 2); });
  const DOOR = { x: 1010, to: 1120 }, DOOR_BACK = { x: 1110, to: 1000 };
  const GUARD = { x: 930, awake: 0 };

  /* ---------- pixel helpers ---------- */
  const bg = $('#bg').getContext('2d'), fx = $('#fx').getContext('2d');
  const P = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); };

  let seed = 11; const RN = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const SEAT = 152;
  function drawBackground() {
    const c = bg; c.clearRect(0, 0, WORLD_W, 180); seed = 11;
    /* ceiling with beams and a vent */
    P(c, 0, 0, 1060, 12, '#121726');
    for (let x = 20; x < 1060; x += 90) { P(c, x, 0, 8, 12, '#0d111d'); P(c, x, 10, 8, 2, '#1d2438'); }
    P(c, 555, 3, 26, 6, '#2a3046'); for (let x = 557; x < 579; x += 3) P(c, x, 4, 1, 4, '#141826');
    /* crown molding */
    P(c, 0, 12, 1060, 2, '#a48a4e'); P(c, 0, 14, 1060, 2, '#6e5a2e'); for (let x = 0; x < 1060; x += 4) P(c, x, 16, 2, 2, '#5a4a26');
    /* damask wallpaper */
    P(c, 0, 18, 1060, WALL_Y - 18, '#2b3858');
    for (let x = 0; x < 1060; x += 10) P(c, x, 18, 1, WALL_Y - 18, '#2e3b5d');
    for (let y = 24, r = 0; y < WALL_Y - 8; y += 14, r++) for (let x = (r % 2) * 10 + 3; x < 1060; x += 20) damask(c, x, y);
    /* chair rail + wainscot */
    P(c, 0, WALL_Y - 3, 1060, 3, '#6b4a33'); P(c, 0, WALL_Y - 3, 1060, 1, '#8a6448');
    P(c, 0, WALL_Y, 1060, 22, '#3f2a1f');
    for (let x = 4; x < 1060; x += 36) { P(c, x, WALL_Y + 4, 30, 14, '#47301f'); P(c, x, WALL_Y + 4, 30, 1, '#2b1c13'); P(c, x, WALL_Y + 4, 1, 14, '#2b1c13'); P(c, x + 29, WALL_Y + 4, 1, 14, '#5d4130'); P(c, x, WALL_Y + 17, 30, 1, '#5d4130'); }
    P(c, 0, WALL_Y + 22, 1060, 3, '#1c120c'); P(c, 0, WALL_Y + 22, 1060, 1, '#3a2618');
    floor(c, 0, 1060, ['#7a5134', '#734c30', '#80573a', '#6e482c'], '#8f6644');
    /* paintings: warm glow, cast shadow, carved frame, picture light, label, a reflection on the parquet */
    ART.filter(a => a.x < 1060).forEach(a => { glow(c, a); frame(c, a); light(c, a); plaque(c, a); reflection(c, a); });
    /* velvet ropes */
    const posts = [];
    ART.filter(a => a.x < 1060).forEach(a => posts.push(a.left - 16, a.left + a.w + 16));
    for (let i = 0; i < posts.length; i += 2) rope(c, posts[i], posts[i + 1]);
    posts.forEach(x => post(c, x));
    /* entrance with exit sign */
    P(c, 6, 46, 38, 99, '#6b4a33'); P(c, 6, 46, 38, 2, '#8a6448'); P(c, 9, 49, 32, 96, '#0b0d16');
    for (let y = 100; y < 145; y += 3) P(c, 9, y, 32, 3, `rgba(80,90,130,${(y - 100) / 300})`);
    P(c, 13, 33, 24, 10, '#103a1e'); P(c, 14, 34, 22, 8, '#2fbf5f');
    P(c, 17, 35, 2, 2, '#eafff0'); P(c, 17, 37, 2, 3, '#eafff0'); P(c, 16, 40, 1, 2, '#eafff0'); P(c, 19, 39, 1, 3, '#eafff0'); P(c, 19, 37, 2, 1, '#eafff0');
    P(c, 24, 38, 8, 1, '#eafff0'); P(c, 30, 37, 1, 3, '#eafff0'); P(c, 31, 38, 1, 1, '#eafff0');
    /* potted ficus */
    ficus(c, 60);

    if (near && !me.moving) { const bob = reduce ? 0 : Math.round(Math.sin(t / 200)); P(c, me.x - 2, FEET - 56 + bob, 4, 5, '#e2bd5c'); P(c, me.x - 1, FEET - 50 + bob, 2, 2, '#e2bd5c'); }
  }
  /* ---------- deadline hall: people and moving things ---------- */
  const MANAGER = { x: 1720, dir: 1, state: 'patrol', goal: 2200, t: 0, cd: 0, say: '' };
  const RUNNER = { x: 1450, dir: 1 };
  const KEEPER = { x: 2440, dir: -1 };
  const LOOK_MGR = { ...SKIN, hair: '#5a3a22', hairStyle: 'short', top: '#e8ecf0', top2: '#c9d0d8', legs: '#3a3f4a', legs2: '#2d313a', shoe: '#1a1410', tie: '#c4252f', tablet: 1, glasses: 1, seed: 9 };
  const LOOK_RUN = { ...SKIN2, hair: '#141414', hairStyle: 'short', top: '#3f9a6a', top2: '#2f7a52', legs: '#2a2a32', legs2: '#1e1e26', shoe: '#f2f2f2', sole: '#999', laptop: 1, headphones: 1, seed: 17 };
  const LOOK_Q1 = { ...SKIN3, hair: '#141414', hairStyle: 'bun', top: '#c47a2a', top2: '#a3631f', legs: '#2f3a5a', legs2: '#263048', shoe: '#222', dress: 0, seed: 2 };
  const LOOK_Q2 = { ...SKIN, hair: '#b5701e', hairStyle: 'curly', top: '#6c7bff', top2: '#5563d9', legs: '#3a3a3a', legs2: '#2a2a2a', shoe: '#c4252f', glasses: 1, seed: 8 };
  const LOOK_KEEP = { ...SKIN2, hair: '#3a2a20', hairStyle: 'short', top: '#1f2a52', top2: '#162042', legs: '#1a1f36', legs2: '#121628', shoe: '#0a0a0a', badge: 1, cup: 1, mustache: '#3a2a20', seed: 4 };
  function drawDeadlineFx(c, t) {
    if (area !== DL) return;
    /* a flickering fluorescent panel */
    if (!reduce && (t % 5300) < 260 && ((t / 60 | 0) % 2)) P(c, 1351 + 30 + 130 * 3 + 1, 4, 42, 5, 'rgba(40,50,48,.85)');
    /* the clock is running way too fast */
    const ccx = 1555, ccy = 27;
    for (let y = -8; y <= 8; y++) for (let x = -8; x <= 8; x++) { const d = Math.hypot(x, y); if (d <= 8) P(c, ccx + x, ccy + y, 1, 1, d > 7 ? '#1d2024' : '#f4f6f4'); }
    for (let k = 0; k < 12; k++) { const a = k / 12 * 6.283; P(c, ccx + Math.round(Math.sin(a) * 6), ccy - Math.round(Math.cos(a) * 6), 1, 1, '#555'); }
    const am = reduce ? 1 : t / 900 * 6.283, ah = reduce ? 2 : t / 9000 * 6.283;
    for (let i = 0; i < 6; i++) P(c, ccx + Math.round(Math.sin(am) * i), ccy - Math.round(Math.cos(am) * i), 1, 1, '#1d2024');
    for (let i = 0; i < 4; i++) P(c, ccx + Math.round(Math.sin(ah) * i), ccy - Math.round(Math.cos(ah) * i), 1, 1, '#c4252f');
    /* the circled date is on fire */
    if (!reduce) for (let i = 0; i < 7; i++) { const p = ((t / 380) + i / 7) % 1; P(c, 1891 + (i % 4) * 2 + Math.round(Math.sin(t / 90 + i) * .8), 56 - p * 7, 1, 2, p < .4 ? '#ffe14a' : p < .7 ? '#ff8a3d' : '#c4252f'); }
    /* bubbles in the cooler */
    if (!reduce) for (let i = 0; i < 4; i++) { const p = ((t / 1400) + i / 4) % 1; P(c, 1884 + i * 2, 126 - p * 22, 1, 1, 'rgba(255,255,255,.8)'); }
    /* coffee steam, printer led and the jammed paper */
    if (!reduce) for (let i = 0; i < 3; i++) { const p = ((t / 800) + i / 3) % 1; P(c, 2085 + Math.round(Math.sin(p * 6 + i)), 111 - p * 12, 1, 2, `rgba(255,255,255,${(.6 * (1 - p)).toFixed(2)})`); }
    if ((t / 300 | 0) % 2) P(c, 2264, 130, 2, 2, '#ff3030'); else P(c, 2264, 130, 2, 2, '#5a1010');
    const jig = reduce ? 0 : ((t / 120 | 0) % 6 === 0 ? 1 : 0);
    P(c, 2270 + jig, 117, 12, 8, '#f4f4f0'); P(c, 2272 + jig, 116, 5, 2, '#f4f4f0'); P(c, 2273 + jig, 119, 6, 1, '#c9c5ba'); P(c, 2276 + jig, 121, 4, 1, '#c9c5ba'); P(c, 2280 + jig, 118, 2, 3, '#e2ded2');
    /* a dead leaf falls now and then */
    if (!reduce) { const p = (t % 6000) / 6000; if (p < .5) P(c, 2398 + Math.round(Math.sin(p * 20) * 4), 124 + p * 2 * 44, 2, 1, '#b8923a'); }
    /* the designer asleep on the laptop */
    const sx = 1566, sy = SEAT;
    P(c, sx - 2, sy - 8, 12, 4, '#2a2a32'); P(c, sx + 8, sy - 6, 4, 22, '#2a2a32'); P(c, sx + 8, sy + 15, 7, 2, '#f2f2f2');
    P(c, sx - 6, sy - 22, 12, 15, '#8a5aa8'); P(c, sx - 6, sy - 22, 3, 15, '#6e4688');
    P(c, sx + 4, sy - 13, 12, 2, '#b8bcc4'); P(c, sx + 15, sy - 21, 1, 9, '#5fa8ff');
    P(c, sx + 4, sy - 22, 9, 9, '#f1c7a5'); P(c, sx + 3, sy - 24, 10, 4, '#b5701e'); P(c, sx + 4, sy - 16, 3, 1, '#d9a684');
    if (!reduce) { const k = (t / 700) % 3; for (let i = 0; i < 3; i++) { const p = ((k + i) % 3) / 3; c.globalAlpha = 1 - p; zz(c, sx + 10 + p * 6, sy - 34 - p * 14, 3 + i); c.globalAlpha = 1; } }
    /* the coffee queue, one of them taps a foot */
    person(c, 2050, FEET, 1, LOOK_Q1, 0, t);
    person(c, 2030, FEET, 1, LOOK_Q2, reduce ? 0 : ((t / 260 | 0) % 2 ? 1 : 0), t);
    /* nervous keeper */
    person(c, KEEPER.x + (reduce ? 0 : ((t / 90 | 0) % 3) - 1), FEET, -1, LOOK_KEEP, 0, t);
    if (!reduce && (t / 2000 | 0) % 2) P(c, KEEPER.x - 6, FEET - 42, 1, 2, '#8fd3ff');
    /* runner with a laptop */
    person(c, RUNNER.x, FEET, RUNNER.dir, LOOK_RUN, (t / 70 | 0), t);
    /* manager with a tablet */
    person(c, MANAGER.x, FEET, MANAGER.dir, LOOK_MGR, MANAGER.moving ? (t / (MANAGER.state === 'approach' ? 80 : 140) | 0) : 0, t);
  }
  function updateDeadlines(dt, sp) {
    RUNNER.x += RUNNER.dir * sp * 2.2; if (RUNNER.x > DL.to - 20) RUNNER.dir = -1; if (RUNNER.x < DL.from + 50) RUNNER.dir = 1;
    const M = MANAGER; M.t += dt; if (M.cd > 0) M.cd -= dt;
    const dist = me.x - M.x;
    if (area === DL && M.state === 'patrol' && M.cd <= 0 && Math.abs(dist) < 150) M.state = 'approach';
    if (M.state === 'patrol') { if (Math.abs(M.goal - M.x) < 2) M.goal = M.goal > 1900 ? 1500 : 2300; M.dir = Math.sign(M.goal - M.x); M.x += M.dir * sp * .45; M.moving = true; }
    if (M.state === 'approach') { M.dir = Math.sign(dist) || 1; if (Math.abs(dist) > 20) { M.x += M.dir * sp * 1.25; M.moving = true; } else { M.state = 'ask'; M.t = 0; M.moving = false; } }
    if (M.state === 'ask') { M.dir = Math.sign(dist) || 1; M.say = M.t < 2400 ? 'Есть минутка?' : 'Ладно, позже подойду'; if (M.t > 4000) { M.state = 'leave'; M.t = 0; M.say = ''; } }
    if (M.state === 'leave') { M.dir = -Math.sign(dist) || 1; M.x += M.dir * sp * .7; M.moving = true; M.x = Math.max(DL.from + 50, Math.min(DL.to - 40, M.x)); if (M.t > 2200) { M.state = 'patrol'; M.cd = 14000; } }
    if (area !== DL && M.state !== 'patrol') { M.state = 'patrol'; M.say = ''; }
    const b = $('#bubble');
    if (M.say) { b.hidden = false; b.textContent = M.say; b.style.left = M.x * S + 'px'; b.style.top = (FEET - 54) * S + 'px'; b.style.fontSize = Math.max(11, 4.4 * S) + 'px'; } else b.hidden = true;
  }

  function zz(c, x, y, s) { P(c, x, y, s, 1, '#cfd6ff'); for (let i = 1; i < s - 1; i++) P(c, x + s - 1 - i, y + i, 1, 1, '#cfd6ff'); P(c, x, y + s - 1, s, 1, '#cfd6ff'); }

  /* ---------- proximity & UI ---------- */
  const box = $('#box');
  let shown = null;
  function nearest() {
    const a = ART.find(a => Math.abs(a.x - me.x) < 34 && me.x >= area.from && me.x <= area.to);
    if (a) return { kind: 'art', a };
    const p = PORTALS.find(p => p.area === area && Math.abs(me.x - p.x) < 15);
    if (p) return { kind: 'portal', p };
    if (area === HALL && Math.abs(me.x - GUARD.x) < 18) return { kind: 'guard' };
    return null;
  }
  function updateBox() {
    const n = nearest(), key = n ? n.kind + (n.a ? n.a.id : '') + (n.p ? n.p.x : '') + area.from : 'none' + area.from;
    if (key === shown) return; shown = key;
    if (!n) { box.innerHTML = `<div class="txt"><b>${area === SECRET ? 'Тайная комната' : area === DL ? 'Зал дедлайнов' : 'Зал экзистенциального кризиса'}</b><span>Подойди к картине или нажми на табличку под ней.</span></div>`; return; }
    if (n.kind === 'art') {
      const a = n.a;
      box.innerHTML = `<div class="txt"><b>${a.title ? a.title : a.author}</b><span>${a.title && a.author ? a.author + ' · ' : ''}${a.meta}</span></div><div class="btns"><button class="pbtn primary" type="button" data-act="look">Рассмотреть</button><button class="pbtn" type="button" data-act="guide">♪ Аудиогид</button></div>`;
    } else if (n.kind === 'portal') {
      box.innerHTML = `<div class="txt"><b>${n.p.title}</b><span>${n.p.sub}</span></div>${n.p.to ? `<div class="btns"><button class="pbtn primary" type="button" data-act="portal">${n.p.btn}</button></div>` : ''}`;
    } else {
      box.innerHTML = `<div class="txt"><b>Смотритель зала</b><span>${GUARD.awake > 0 ? '«Я всё видел. Руками не трогать!»' : 'Спит. Лучше не будить.'}</span></div>`;
    }
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const n = nearest(); const act = b.dataset.act;
    if (act === 'look' && n?.a) look(n.a);
    if (act === 'guide' && n?.a) guide(n.a);
    if (act === 'portal' && n?.p) teleport(n.p.to, n.p.tx, n.p.toast);
  });
  const PORTALS = [
    { area: HALL, x: DOOR.x, to: SECRET, tx: 1120, title: 'Посторонним вход воспрещён', sub: 'За дверью кто-то тихо говорит «хмм».', btn: 'Войти', toast: 'Ты нашёл(а) тайную комнату' },
    { area: SECRET, x: DOOR_BACK.x, to: HALL, tx: 1000, title: 'Обратно в зал', sub: 'Никому не говори, что ты здесь был(а).', btn: 'Выйти' },
    { area: DL, x: 2438, to: HALL, tx: 40, title: 'Зал экзистенциального кризиса', sub: 'Дедлайны позади. Самое время спросить себя «зачем это всё».', btn: 'Перейти', toast: 'Зал экзистенциального кризиса. Тут можно не торопиться' },
    { area: HALL, x: 25, to: DL, tx: 2405, title: 'Зал дедлайнов', sub: 'Оттуда слышно, как кто-то спрашивает «есть минутка?».', btn: 'Вернуться' },
    { area: HALL, x: 895, title: 'Рок-зал', sub: 'Скоро откроется. Пока там настраивают гитары.' },
    { area: DL, x: 1372, title: 'Фойе', sub: 'Выход там же, где вход. Но ты же только пришёл(а).' }
  ];
  function teleport(ar, x, msg) {
    stage.animate([{ opacity: 1 }, { opacity: 0, offset: .45 }, { opacity: 0, offset: .55 }, { opacity: 1 }], { duration: reduce ? 1 : 600 });
    setTimeout(() => { area = ar; me.x = x; me.target = null; shown = null; mask(); camera(true); if (msg) toast(msg); }, reduce ? 0 : 280);
  }

  /* look closer */
  const lookEl = $('#look');
  function look(a) {
    lookEl.innerHTML = `<div class="look-in"><div class="frame"><img src="${a.img}" alt="${[a.author, a.title && a.title].filter(Boolean).join('. ')}"></div>
      <div class="label"><h2>${[a.author, a.title && a.title].filter(Boolean).join('<br>')}</h2><div class="meta">${a.meta}</div><p>${a.text}</p>
      <div class="row"><button class="lbtn" type="button" id="lGuide">♪ Аудиогид</button><button class="lbtn ghost" type="button" id="lClose">Вернуться в зал</button></div>
      <div class="inv">Из частной коллекции А. Демешко · инв. № ${String(ART.indexOf(a) + 1).padStart(3, '0')}</div></div></div>`;
    lookEl.hidden = false; $('#lClose').focus();
    $('#lClose').onclick = () => lookEl.hidden = true;
    $('#lGuide').onclick = () => guide(a);
  }
  lookEl.addEventListener('click', e => { if (e.target === lookEl) lookEl.hidden = true; });

  /* audio guide: the track that goes with the painting */
  function guide(a) {
    $('#gTrack').textContent = a.track;
    $('#gLink').href = a.sp ? 'https://open.spotify.com/track/' + a.sp : 'https://open.spotify.com/playlist/14TdC0nbL1qSOms0uueJ5V';
    const src = a.sp ? 'https://open.spotify.com/embed/track/' + a.sp + '?utm_source=generator&theme=0' : 'https://open.spotify.com/embed/playlist/14TdC0nbL1qSOms0uueJ5V?utm_source=generator&theme=0';
    const pl = $('#gPlayer'); if (pl.getAttribute('src') !== src) pl.src = src;
    $('#guide').hidden = false;
  }
  $('#gClose').onclick = () => $('#guide').hidden = true;

  /* touching the art */
  const alarm = $('#alarm');
  arts.addEventListener('pointerdown', e => {
    const im = e.target.closest('.art'); if (!im) return;
    e.stopPropagation();
    alarm.classList.add('on'); GUARD.awake = 3000;
    if (navigator.vibrate) try { navigator.vibrate([80, 60, 80]); } catch {}
    setTimeout(() => alarm.classList.remove('on'), 1300);
    setTimeout(() => toast('Смотреть можно, трогать нельзя. Подойди и нажми «Рассмотреть»'), 1300);
  });

  let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

  /* ---------- input ---------- */
  const held = { l: false, r: false };
  addEventListener('keydown', e => {
    if (!lookEl.hidden) { if (e.key === 'Escape') lookEl.hidden = true; return; }
    if (['ArrowLeft', 'a', 'A', 'ф', 'Ф'].includes(e.key)) { held.l = true; me.target = null; e.preventDefault(); }
    if (['ArrowRight', 'd', 'D', 'в', 'В'].includes(e.key)) { held.r = true; me.target = null; e.preventDefault(); }
    if (['e', 'E', 'у', 'У', 'Enter'].includes(e.key) && document.activeElement?.tagName !== 'BUTTON') { const n = nearest(); if (n?.a) look(n.a); }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { const n = nearest(); if (n?.kind === 'portal' && n.p.to) teleport(n.p.to, n.p.tx, n.p.toast); e.preventDefault(); }
  });
  addEventListener('keyup', e => {
    if (['ArrowLeft', 'a', 'A', 'ф', 'Ф'].includes(e.key)) held.l = false;
    if (['ArrowRight', 'd', 'D', 'в', 'В'].includes(e.key)) held.r = false;
  });
  const hold = (id, k) => { const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); held[k] = true; me.target = null; b.classList.add('down'); b.setPointerCapture(e.pointerId); });
    const up = () => { held[k] = false; b.classList.remove('down'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  };
  hold('#left', 'l'); hold('#right', 'r');
  /* tap the floor to walk there */
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.box') || e.target.closest('.art') || e.target.closest('.plq')) return;
    const r = stage.getBoundingClientRect();
    me.target = Math.max(area.from + 6, Math.min(area.to - 6, camX + (e.clientX - r.left) / S));
  });

  /* ---------- loop ---------- */
  let last = performance.now();
  function tick(t) {
    const dt = Math.min(50, t - last); last = t;
    const sp = .075 * dt;
    let dx = (held.r ? 1 : 0) - (held.l ? 1 : 0);
    if (!dx && me.target != null) { const d = me.target - me.x; if (Math.abs(d) < 1.5) me.target = null; else dx = Math.sign(d); }
    me.moving = !!dx;
    if (dx) { me.dir = dx; me.x = Math.max(area.from + 6, Math.min(area.to - 6, me.x + dx * sp)); }
    /* a visitor drifts between two paintings, a pigeon wanders by the entrance */
    NPCS.forEach(n => { if (!n.walk) return; n.t = (n.t || 0) + dt; if (n.t > 4500) { n.t = 0; n.goal = n.goal === n.walk[0] ? n.walk[1] : n.walk[0]; }
      if (n.goal != null && Math.abs(n.goal - n.x) > 1) { n.moving = true; n.dir = Math.sign(n.goal - n.x); n.x += n.dir * sp * .4; } else n.moving = false; });
    PIGEON.t += dt; if (PIGEON.peck > 0) PIGEON.peck -= dt;
    if (PIGEON.t > 1800) { PIGEON.t = 0; const r = Math.random(); if (r < .35) PIGEON.peck = 500; else if (r < .55) PIGEON.dir *= -1; }
    PIGEON.moving = PIGEON.peck <= 0 && PIGEON.t < 1000;
    if (PIGEON.moving) { PIGEON.x += PIGEON.dir * sp * .25; if (PIGEON.x < 80 || PIGEON.x > 200) PIGEON.dir *= -1; }
    if (GUARD.awake > 0) GUARD.awake -= dt;
    updateDeadlines(dt, sp);
    camera();
    drawFx(t);
    updateBox();
    requestAnimationFrame(tick);
  }

  drawBackground();
  layout();
  addEventListener('resize', layout);
  requestAnimationFrame(tick);
  window.__m = { me, look, ART, go: (a, x) => { area = a === 'dl' ? DL : HALL; me.x = x; mask(); camera(true); } };
})();
</script>

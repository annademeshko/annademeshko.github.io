name: Capture portfolio link previews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/og-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start site locally
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          sleep 2
      - name: Screenshot the first viewport of both homepages
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('assets/social', { recursive: true });
          const browser = await chromium.launch();
          for (const [lang, url] of [
            ['ru', 'http://127.0.0.1:8080/ru/'],
            ['en', 'http://127.0.0.1:8080/'],
          ]) {
            const page = await browser.newPage({
              viewport: { width: 1200, height: 630 },
              deviceScaleFactor: 1,
              colorScheme: 'light',
              reducedMotion: 'reduce'
            });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.evaluate(async () => {
              await document.fonts.ready;
              const portrait = document.querySelector('.intro-photo');
              if (portrait) await portrait.decode().catch(() => {});
            });
            await page.waitForTimeout(750);
            await page.screenshot({
              path: 'assets/social/home-' + lang + '.png',
              animations: 'disabled',
            });
            await page.close();
          }
          await browser.close();
          JS
      - name: Save screenshots in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/home-ru.png assets/social/home-en.png
          if ! git diff --cached --quiet; then
            git commit -m "Add homepage screenshots for social previews"
            git push
          fi
